name: Déploiement SFTP — connectis-solutions.fr

on:
  push:
    branches: [main]
    paths:
      - "wp-content/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Déploiement SFTP (wp-content : thème, extensions, mu-plugin)"
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_SERVER }}
          port: ${{ secrets.SFTP_PORT }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: "wp-content/*"
          remote_path: "${{ secrets.SFTP_REMOTE_PATH }}/wp-content"
