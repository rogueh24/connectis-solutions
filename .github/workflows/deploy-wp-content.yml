name: "Déploiement SFTP — connectis-solutions.fr"

on:
  push:
    branches: [main]
    paths:
      - "wp-content/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Installation de lftp"
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: "Déploiement incrémental (lftp mirror, ne transfère que ce qui a changé)"
        env:
          SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          cat > deploy.lftp <<SCRIPT
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          set mirror:parallel-transfer-count 4
          open -u "$SFTP_USERNAME","$SFTP_PASSWORD" -p "$SFTP_PORT" sftp://$SFTP_SERVER
          mirror --reverse --ignore-time --verbose --parallel=4 wp-content "$SFTP_REMOTE_PATH/wp-content"
          SCRIPT
          lftp -f deploy.lftp
          rm -f deploy.lftp
